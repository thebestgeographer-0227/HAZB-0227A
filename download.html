  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    .dl-wrap {
      min-height: 100vh;

    .dl-card {

      margin-top: 32px;
      background: var(--accent); color: #04201c;
      font-weight: 600; letter-spacing: 0.06em;
      border: 0; border-radius: 100px;
      padding: 16px 34px; cursor: pointer; font-size: 1.02rem;
      transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease);
    }
    .dl-btn:hover { transform: translateY(-2px); box-shadow: 0 16px 40px rgba(94,234,212,0.3); }
    .dl-meta { margin-top: 26px; font-size: 0.8rem; color: var(--faint); letter-spacing: 0.04em; }
    .dl-meta code { color: var(--accent); }
    .dl-back { margin-top: 30px; }
    .dl-back a { color: var(--muted); font-size: 0.86rem; border-bottom: 1px solid var(--panel-border); padding-bottom: 2px; }
    .arrow { font-size: 1.1rem; }
  </style>
</head>
